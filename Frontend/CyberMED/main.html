<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMED</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-content">
            <h2 class="sidebar-text">CyberMED</h2>
            <div><input type="text" placeholder="Patient ID"></div>
            <div id="tokenStream"><textarea>Work</textarea></div>
        </div>
        <div class="sidebar-functions">
            <button type="button">Summarize Symptoms</button>
        </div>
        <div class="sidebar-functions">
            <button type="button">Summarize Medical Records</button>
        </div>
        <div class="chat-area collapsed">
            <div class="chat-box">
                <form action="=/main.html" method="post" id="form">
                    <input type="text" id="chatInput" placeholder="Type your message">
                </form> 
            </div>
        </div>
    </div>
    <div class="toggle-btn" id="sidebar-toggle">
        <div class="toggle-icon"></div>
    </div>
    <div class="main-content">
        <h1 id="header">Clinical Note</h1>
        <div class="box">
        <h2>Paitent Information</h2>
        <table>
            <tr>
                <th>First Name</th>
                <td>Kristen</td>
                <th>Last Name</th>
                <td>Chu</td>
                <th>Date of Birth</th>
                <td>18.05.2000</td>
                <th>Examination Date</th>
                <td>11.23.2022</td>
            </tr>
        </table>
        </div>
        <div class="box">
            <h2>Current Symptoms</h2>
            <textarea id="patientInfo" class="fillForms">Information from patients provides pre session appears here</textarea>
        </div>
        <div class="box">
            <h2>Medical History and Medication</h2>
            <textarea id="medHistory" class="fillForms">Information from patients previous medical treatment</textarea>
        </div>
        <div class="box">
            <h2>Radiology and Lab tests</h2>
            <textarea id="currentMedications" class="fillForms">Previous radiology tests
                1. Radology test preformed xxx 
                Results: 
                why: 
                5. medication five
            </textarea>
        </div>
        <div class="box">
            <h2>Treatment Plan</h2>
                <textarea id="Radiology" class="fillForms">How to proceed
                    what:
                    when:
                    why: 
                </textarea>
        </div>    
    </div>
    <script src="script.js"></script>
</body>
</html>
